<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer navy circle with border -->
  <circle cx="60" cy="60" r="58" fill="#0a1f5c" stroke="#c8a84b" stroke-width="4"/>
  <!-- Inner ring text band -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#c8a84b" stroke-width="1.5"/>

  <!-- Torch flame (top center) -->
  <ellipse cx="60" cy="22" rx="5" ry="9" fill="#e8a020" opacity="0.9"/>
  <ellipse cx="60" cy="20" rx="3" ry="6" fill="#f5c842"/>
  <ellipse cx="60" cy="18" rx="2" ry="4" fill="#fff8dc"/>

  <!-- Torch handle -->
  <rect x="58" y="28" width="4" height="12" rx="2" fill="#c8a84b"/>

  <!-- Book (center) -->
  <rect x="38" y="52" width="44" height="28" rx="3" fill="#1a3a8a" stroke="#c8a84b" stroke-width="1.5"/>
  <line x1="60" y1="52" x2="60" y2="80" stroke="#c8a84b" stroke-width="1.5"/>
  <line x1="44" y1="60" x2="56" y2="60" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>
  <line x1="44" y1="65" x2="56" y2="65" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>
  <line x1="44" y1="70" x2="56" y2="70" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="60" x2="76" y2="60" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="65" x2="76" y2="65" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="70" x2="76" y2="70" stroke="#c8a84b" stroke-width="1" opacity="0.7"/>

  <!-- UNILAK text -->
  <text x="60" y="98" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900"
        font-size="13" fill="#ffffff" letter-spacing="2">UNILAK</text>

  <!-- Since 1997 banner -->
  <rect x="28" y="103" width="64" height="11" rx="3" fill="#c8a84b"/>
  <text x="60" y="112" text-anchor="middle" font-family="Arial" font-weight="700"
        font-size="7" fill="#0a1f5c" letter-spacing="1">Since 1997</text>

  <!-- Arc text top: UNIVERSITY OF LAY ADVENTISTS OF KIGALI -->
  <path id="topArc" d="M 12,60 A 48,48 0 0,1 108,60" fill="none"/>
  <text font-family="Arial" font-size="6.5" fill="#c8a84b" font-weight="700" letter-spacing="0.8">
    <textPath href="#topArc" startOffset="8%">UNIVERSITY OF LAY ADVENTISTS OF KIGALI</textPath>
  </text>

  <!-- Stars left and right -->
  <text x="18" y="72" font-size="8" fill="#c8a84b">★</text>
  <text x="96" y="72" font-size="8" fill="#c8a84b">★</text>
</svg>
